<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение на свидание</title>
<style>
  :root{
    --cream:#FFF6F1;
    --blush:#FFE1E9;
    --rose:#D6336C;
    --rose-dark:#A61E4D;
    --gold:#F2A65A;
    --ink:#3B2F33;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

 body{
   min-height:100vh;
  background:
    linear-gradient(rgba(255,246,241,.75), rgba(255,246,241,.75)),
    url("background1.jpg") center/cover no-repeat;
  ...
}
    font-family:'Poppins', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&family=Caveat:wght@600;700&display=swap');

  #hearts{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .heart{
    position:absolute; bottom:-10%; font-size:1.4rem; opacity:.55;
    animation:rise linear infinite;
    color:var(--rose);
  }
  @keyframes rise{
    to{ transform:translateY(-120vh) rotate(25deg); opacity:0; }
  }

  .toolbar{
    position:fixed; top:14px; right:14px; z-index:20;
    display:flex; gap:8px;
  }
  .toolbar button{
    font-family:'Poppins',sans-serif;
    font-size:.8rem;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    opacity:.85;
    transition:opacity .2s, transform .2s;
  }
  .toolbar button:hover{ opacity:1; transform:translateY(-1px); }
  .toolbar button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .card{
    position:relative;
    z-index:1;
    width:min(420px, 92vw);
    background:#fff;
    border-radius:28px;
    padding:28px 26px 34px;
    box-shadow:0 30px 60px -20px rgba(166,30,77,.35), 0 2px 6px rgba(0,0,0,.05);
    text-align:center;
  }

  /* ---------- gallery (multi-page photos) ---------- */
  .gallery{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:20px;
    overflow:hidden;
    background:linear-gradient(135deg, var(--blush), #FFD9C2);
    margin-bottom:14px;
  }
  .gallery-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .45s ease;
  }
  .gallery-slide{
    flex:0 0 100%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gallery-slide img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .gallery-caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:10px 14px 12px;
    font-size:.82rem;
    font-weight:600;
    color:#fff;
    text-align:left;
    background:linear-gradient(to top, rgba(59,47,51,.65), transparent);
  }
  .photo-hint{
    font-size:.85rem;
    color:var(--rose-dark);
    font-weight:600;
    padding:0 20px;
    text-align:center;
  }
  .gallery-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.85);
    border:none;
    width:32px; height:32px;
    border-radius:50%;
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--rose-dark);
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .gallery-nav.prev{ left:8px; }
  .gallery-nav.next{ right:8px; }
  .gallery-nav:focus-visible{ outline:2px solid var(--gold); }
  body:not(.has-gallery) .gallery-nav,
  body:not(.has-gallery) .gallery-dots{ display:none; }

  .gallery-dots{
    position:absolute;
    bottom:8px; left:0; right:0;
    display:flex; justify-content:center; gap:6px;
  }
  .gallery-dots span{
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,.6);
    cursor:pointer;
  }
  .gallery-dots span.active{ background:#fff; }

  .photo-wrap{ cursor:pointer; }
  body.edit-mode .photo-wrap{ outline:2px dashed var(--rose); outline-offset:2px; }
  body:not(.edit-mode) .photo-wrap{ cursor:default; }

  .eyebrow{
    font-family:'Caveat',cursive;
    font-size:1.3rem;
    color:var(--rose);
    margin:0 0 2px;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.9rem;
    line-height:1.25;
    margin:0 0 10px;
    color:var(--rose-dark);
  }

  .message{
    font-size:.98rem;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 26px;
  }

  [contenteditable="true"]{
    outline:none;
    border-radius:8px;
  }
  body.edit-mode [contenteditable="true"]:hover,
  body.edit-mode [contenteditable="true"]:focus{
    background:rgba(214,51,108,.07);
    box-shadow:0 0 0 2px rgba(214,51,108,.25);
  }

  .buttons{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    min-height:70px;
  }

  button.choice{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:1rem;
    border:none;
    border-radius:999px;
    padding:14px 28px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.choice:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  #yesBtn{
    background:var(--rose);
    color:#fff;
    box-shadow:0 10px 20px -8px rgba(214,51,108,.6);
  }
  #yesBtn:hover{ transform:scale(1.06); }

  #noBtn{
    background:#fff;
    color:var(--ink);
    border:1.5px solid #e6d9dc;
    position:relative;
  }

  body.edit-mode #noBtn, body.edit-mode #yesBtn{
    position:static !important;
  }

  .footnote{
    margin-top:16px;
    font-size:.72rem;
    color:#b9a3a8;
  }

  /* success screen */
  #success{
    display:none;
    padding:10px 0 4px;
  }
  #success.show{ display:block; animation:pop .4s ease; }
  @keyframes pop{
    from{ transform:scale(.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  #success .big{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:2rem;
    color:var(--rose-dark);
  }

  #msgForm{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #msgInput{
    width:100%;
    font-family:'Poppins',sans-serif;
    font-size:.92rem;
    padding:12px 14px;
    border-radius:14px;
    border:1.5px solid #e6d9dc;
    resize:vertical;
    min-height:70px;
  }
  #msgInput:focus{
    outline:none;
    border-color:var(--rose);
    box-shadow:0 0 0 2px rgba(214,51,108,.2);
  }
  #sendMsgBtn{
    background:var(--rose);
    color:#fff;
    align-self:center;
  }
  #sendMsgBtn:disabled{
    opacity:.6;
    cursor:default;
  }
  #sendStatus{
    font-size:.8rem;
    min-height:1.1em;
    color:var(--rose-dark);
    margin:0;
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .heart{ animation:none; display:none; }
    button.choice{ transition:none; }
    .gallery-track{ transition:none; }
  }

  /* ---------- mobile ---------- */
  @media (max-width: 480px){
    .card{
      width:94vw;
      padding:22px 18px 28px;
      border-radius:22px;
    }
    h1{ font-size:1.55rem; }
    .message{ font-size:.92rem; margin-bottom:20px; }
    .eyebrow{ font-size:1.15rem; }
    .buttons{ min-height:120px; gap:12px; }
    button.choice{
      font-size:.92rem;
      padding:13px 22px;
      touch-action:manipulation;
    }
    .toolbar{ top:10px; right:10px; }
    .toolbar button{ font-size:.72rem; padding:7px 12px; }
  }

  @media (max-width: 360px){
    h1{ font-size:1.4rem; }
  }
</style>
</head>
<body>

<div id="hearts"></div>

<div class="toolbar">
  <button id="editToggle" type="button">✏️ Редактировать</button>
</div>

<main class="card">

  <!--
    ====== КАК ЗАДАТЬ СВОИ ФОТО ДЛЯ РАЗНЫХ "СТРАНИЦ" ======
    Ничего в HTML менять не нужно. Все фото задаются одним массивом
    PAGES в <script> ниже (ищи "КОНФИГ ГАЛЕРЕИ"). Просто положи
    картинки в папку рядом с этим файлом (например, папку "photos"
    в том же репозитории на GitHub) и укажи пути:

      const PAGES = [
        { src: "photos/1.jpg", caption: "Наша первая встреча" },
        { src: "photos/2.jpg", caption: "Тот самый вечер" },
        { src: "photos/3.jpg", caption: "" }
      ];

    Если положишь файлы в репозиторий на GitHub, путь может быть
    относительным ("photos/1.jpg") или прямой ссылкой на raw-файл
    (https://raw.githubusercontent.com/ユーザー/репо/main/photos/1.jpg).
  -->
  <div class="gallery photo-wrap" id="photoWrap">
    <div class="gallery-track" id="galleryTrack"></div>
    <span class="photo-hint" id="photoHint">Нажми, чтобы загрузить фото</span>
    <button class="gallery-nav prev" id="prevSlide" type="button" aria-label="Предыдущее фото">‹</button>
    <button class="gallery-nav next" id="nextSlide" type="button" aria-label="Следующее фото">›</button>
    <div class="gallery-dots" id="galleryDots"></div>
    <input type="file" id="photoInput" accept="image/*" class="hidden">
  </div>

  <div id="question">
    <p class="eyebrow" contenteditable="false" id="eyebrow">Один вопрос...</p>
    <h1 contenteditable="false" id="title"> Как насчет посмотреть на звездопад вдвоём только ты я и пачка чипсов</h1>
    <p class="message" contenteditable="false" id="message">
      123
    </p>

    <div class="buttons" id="buttonsWrap">
      <button class="choice" id="yesBtn" contenteditable="false">Да да и да!</button>
      <button class="choice" id="noBtn" contenteditable="false">Нет</button>
    </div>
  </div>

  <div id="success">
    <p class="big" id="successText">Как насчет 00:00💌</p>

    <div id="msgForm">
      <textarea id="msgInput" rows="3" placeholder="Можешь мне что-нибудь написать! by Naitmak "></textarea>
      <button class="choice" id="sendMsgBtn" type="button">Отправить мне сообщение</button>
      <p id="sendStatus" aria-live="polite"></p>
    </div>
  </div>

  <p class="footnote">сделано с любовью, специально для тебя</p>

</main>

<script>
  // ================== КОНФИГ ГАЛЕРЕИ ==================
  // Добавляй/убирай/переставляй строки — фото и подписи подтянутся
  // автоматически, листалка (стрелки/точки) появится сама, если тут
  // больше одной картинки. Пустая подпись caption:"" — подпись просто
  // не покажется.
  const PAGES = [
    { src: "photoo.jpg", caption: "" }
    // { src: "photo2.jpg", caption: "Тот  " },
    // { src: "photos/3.jpg", caption: "" }
  ];
  // ======================================================

  let currentSlide = 0;

  function buildGallery(){
    const track = document.getElementById('galleryTrack');
    const dots = document.getElementById('galleryDots');
    const hint = document.getElementById('photoHint');
    track.innerHTML = '';
    dots.innerHTML = '';

    PAGES.forEach((page, i) => {
      const slide = document.createElement('div');
      slide.className = 'gallery-slide';

      const img = document.createElement('img');
      img.src = page.src;
      img.alt = page.caption || '';
      img.onerror = () => { img.style.display = 'none'; };
      slide.appendChild(img);

      if(page.caption){
        const cap = document.createElement('div');
        cap.className = 'gallery-caption';
        cap.textContent = page.caption;
        slide.appendChild(cap);
      }
      track.appendChild(slide);

      const dot = document.createElement('span');
      if(i === 0) dot.classList.add('active');
      dot.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(i); });
      dots.appendChild(dot);
    });

    document.body.classList.toggle('has-gallery', PAGES.length > 1);
    hint.style.display = 'none'; // прячем подсказку, раз есть картинки из конфига
    goToSlide(0);
  }

  function goToSlide(i){
    if(PAGES.length === 0) return;
    currentSlide = (i + PAGES.length) % PAGES.length;
    const track = document.getElementById('galleryTrack');
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('#galleryDots span').forEach((d, idx) => {
      d.classList.toggle('active', idx === currentSlide);
    });
  }

  function initGalleryNav(){
    document.getElementById('prevSlide').addEventListener('click', (e) => {
      e.stopPropagation();
      goToSlide(currentSlide - 1);
    });
    document.getElementById('nextSlide').addEventListener('click', (e) => {
      e.stopPropagation();
      goToSlide(currentSlide + 1);
    });
  }

  // ---------- editable state ----------
  function setEditMode(on){
    document.body.classList.toggle('edit-mode', on);
    const editables = document.querySelectorAll('#eyebrow, #title, #message, #yesBtn, #noBtn, #successText');
    editables.forEach(el => el.setAttribute('contenteditable', on ? 'true' : 'false'));
    document.getElementById('editToggle').textContent = on ? '✅ Готово' : '✏️ Редактировать';
    if(!on){ resetNoButtonPosition(); }
  }

  function initEditToggle(){
    const btn = document.getElementById('editToggle');
    let editing = false;
    btn.addEventListener('click', () => {
      editing = !editing;
      setEditMode(editing);
    });
  }

  // ---------- photo upload (ручная замена текущего слайда, если нужно) ----------
  function initPhotoUpload(){
    const wrap = document.getElementById('photoWrap');
    const input = document.getElementById('photoInput');

    wrap.addEventListener('click', (e) => {
      if(e.target.closest('.gallery-nav') || e.target.closest('.gallery-dots')) return;
      if(document.body.classList.contains('edit-mode')) input.click();
    });

    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const imgs = document.querySelectorAll('#galleryTrack img');
        const img = imgs[currentSlide];
        if(img){
          img.src = ev.target.result;
          img.style.display = 'block';
        }
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- runaway "No" button ----------
  let noScale = 1;
  const MIN_SCALE = 0.35;

  function resetNoButtonPosition(){
    const noBtn = document.getElementById('noBtn');
    noBtn.style.position = 'static';
    noBtn.style.left = '';
    noBtn.style.top = '';
    noBtn.style.transform = '';
    noScale = 1;
  }

  function dodge(noBtn, wrap){
    if(document.body.classList.contains('edit-mode')) return;
    if(noScale <= MIN_SCALE) return;

    const wrapRect = wrap.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    noScale = Math.max(MIN_SCALE, noScale - 0.09);

    const maxLeft = wrapRect.width - btnRect.width;
    const maxTop = wrapRect.height - btnRect.height + 20;

    const newLeft = Math.random() * Math.max(0, maxLeft);
    const newTop = Math.random() * Math.max(0, maxTop) - 10;

    noBtn.style.position = 'absolute';
    noBtn.style.left = newLeft + 'px';
    noBtn.style.top = newTop + 'px';
    noBtn.style.transform = `scale(${noScale})`;
  }

  function initNoButton(){
    const noBtn = document.getElementById('noBtn');
    const wrap = document.getElementById('buttonsWrap');
    wrap.style.position = 'relative';

    const trigger = () => dodge(noBtn, wrap);

    noBtn.addEventListener('mouseenter', trigger);
    noBtn.addEventListener('click', (e) => { e.preventDefault(); trigger(); });
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); trigger(); }, {passive:false});
  }

  // ---------- отправка сообщения на почту ----------
  // Замени на свой endpoint с formspree.io (см. инструкцию под кодом)
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/maqrdnvz"; // <-- сюда свой ID
  const TARGET_EMAIL = "naitmak6508@gmail.com";

  function initMessageForm(){
    const btn = document.getElementById('sendMsgBtn');
    const input = document.getElementById('msgInput');
    const status = document.getElementById('sendStatus');

    btn.addEventListener('click', () => sendMessage(input, btn, status));
  }

  async function sendMessage(input, btn, status){
    const text = input.value.trim();
    if(!text){
      status.textContent = 'Напиши хоть что-нибудь :)';
      return;
    }

    btn.disabled = true;
    status.textContent = 'Отправляю...';

    try{
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          message: text,
          _subject: 'Она ответила на приглашение 💌'
        })
      });

      if(res.ok){
        status.textContent = 'Отправлено! Он получит сообщение 💌';
        input.value = '';
        btn.disabled = false;
      } else {
        throw new Error('bad response');
      }
    } catch(err){
      // фолбэк — открываем почтовый клиент с готовым письмом
      const mailto = `mailto:${TARGET_EMAIL}?subject=${encodeURIComponent('Она ответила на приглашение 💌')}&body=${encodeURIComponent(text)}`;
      window.location.href = mailto;
      status.textContent = 'Открываю почту для отправки...';
      btn.disabled = false;
    }
  }

  // ---------- "Yes" button ----------
  function initYesButton(){
    const yesBtn = document.getElementById('yesBtn');
    yesBtn.addEventListener('click', () => {
      if(document.body.classList.contains('edit-mode')) return;
      document.getElementById('question').classList.add('hidden');
      document.getElementById('success').classList.add('show');
      launchHeartBurst();
    });
  }

  // ---------- floating background hearts ----------
  function initBackgroundHearts(){
    const container = document.getElementById('hearts');
    const symbols = ['♥','❣','💗'];
    for(let i=0;i<14;i++){
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      h.style.left = Math.random()*100 + '%';
      h.style.animationDuration = (8 + Math.random()*10) + 's';
      h.style.animationDelay = (Math.random()*10) + 's';
      h.style.fontSize = (1 + Math.random()*1.4) + 'rem';
      container.appendChild(h);
    }
  }

  function launchHeartBurst(){
    const container = document.getElementById('hearts');
    for(let i=0;i<20;i++){
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '♥';
      h.style.left = (40 + Math.random()*20) + '%';
      h.style.bottom = '10%';
      h.style.animationDuration = (2 + Math.random()*2) + 's';
      h.style.fontSize = (1 + Math.random()*1.6) + 'rem';
      container.appendChild(h);
      setTimeout(() => h.remove(), 4000);
    }
  }

  // ---------- init ----------
  function init(){
    buildGallery();
    initGalleryNav();
    initEditToggle();
    initPhotoUpload();
    initNoButton();
    initYesButton();
    initMessageForm();
    initBackgroundHearts();
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
